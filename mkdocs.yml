site_name: Ageless Engineering

site_url: https://ageless-inc.github.io/engineering/

nav:
  - Introduction: index.md
  - Vision: vision.md

theme:
  name: material
  language: ja
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # ライト/ダークをシステム設定 (prefers-color-scheme) に追従
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライト/ダークモードを切り替え
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードへ切り替え
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードへ切り替え

plugins:
  - search:
      lang:
        - ja
        - en
      # CJK (日本語) はクライアント側分割時にゼロ幅スペース (U+200B) が挿入されるため、
      # separator に \u200b を含めて検索インデックスを分割する (Material 公式の日本語推奨)
      separator: '[\s\u200b\-]'

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: >
  Copyright &copy; 2026 株式会社エイジレス

extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://ageless.co.jp/
      name: 会社概要
    - icon: fontawesome/brands/github
      link: https://github.com/ageless-inc/engineering
      name: GitHub
