site_name: Ageless Engineering

site_url: https://engineering.ageless.co.jp/

nav:
  - Introduction: index.md
  - Vision: vision.md

theme:
  name: material
  language: ja
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # ライト/ダークをシステム設定 (prefers-color-scheme) に追従
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライト/ダークモードを切り替え
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードへ切り替え
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードへ切り替え

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - ja
        - en
      # CJK (日本語) はクライアント側分割時にゼロ幅スペース (U+200B) が挿入されるため、
      # separator に \u200b を含めて検索インデックスを分割する (Material 公式の日本語推奨)
      separator: '[\s\u200b\-]'

  # 各ページ下部に git 履歴から算出した「最終更新日」を表示する (生きたドキュメントの信頼性向上)。
  # 正確な日付には全履歴が必要なため CI/deploy 双方の checkout に fetch-depth: 0 を設定している。
  # git 履歴を持たないファイル (新規・未コミット) はビルド日にフォールバックし、--strict でも失敗させない。
  - git-revision-date-localized:
      type: date
      locale: ja
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: >
  Copyright &copy; 2026 株式会社エイジレス &middot;
  本サイトは <a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener">CC BY 4.0</a> ライセンスのもとで提供されています

extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://ageless.co.jp/
      name: 会社概要
    - icon: fontawesome/brands/github
      link: https://github.com/ageless-inc/engineering
      name: GitHub
