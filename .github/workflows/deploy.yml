name: Deploy MkDocs site

on:
  # production への push で本番サイトへ自動デプロイ
  push:
    branches:
      - production
  # GitHub Actions タブから手動実行も可能にする
  workflow_dispatch:

# gh-deploy が gh-pages ブランチへ push するため contents: write が必要
permissions:
  contents: write

# デプロイの同時実行を抑止する。進行中のデプロイは中断せず順番に流しきる
# (gh-pages への push を途中でキャンセルすると中途半端な状態になりうるため false)
concurrency:
  group: deploy-mkdocs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # git 履歴を使うプラグイン (最終更新日表示等) は未導入のため浅いクローンで十分。
      # 将来そうしたプラグインを導入する場合は fetch-depth: 0 を追加すること。
      - name: Checkout
        uses: actions/checkout@v6

      # 公式 astral-sh/setup-uv で uv をセットアップ。
      # このアクションはマイナータグ (@v8) を発行していないため固定タグで pin する。
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # uv.lock どおりに依存をインストール
      - name: Install dependencies
        run: uv sync --frozen

      # ビルドと gh-pages への デプロイを一括実行
      - name: Build and deploy to GitHub Pages
        run: uv run --frozen mkdocs gh-deploy --force
