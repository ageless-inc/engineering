name: Deploy MkDocs site

on:
  # production への push で本番サイトへ自動デプロイ
  push:
    branches:
      - production
  # GitHub Actions タブから手動実行も可能にする
  workflow_dispatch:

# gh-deploy が gh-pages ブランチへ push するため contents: write が必要
permissions:
  contents: write

# デプロイの同時実行を抑止する。進行中のデプロイは中断せず順番に流しきる
# (gh-pages への push を途中でキャンセルすると中途半端な状態になりうるため false)
concurrency:
  group: deploy-mkdocs
  cancel-in-progress: false

jobs:
  deploy:
    # ランナー世代の自動切替によるビルド差異を避けるためメジャー版を固定 (latest は 24.04 を指す)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # git 履歴を使うプラグイン (最終更新日表示等) は未導入のため浅いクローンで十分。
      # 公開物を生成するのはこの deploy 側なので、将来そうしたプラグインを導入する
      # 場合は (CI ではなく) ここに fetch-depth: 0 を追加すること。
      # このジョブは contents: write を持ち gh-pages を改ざんできるため、以降の Action は特に
      # サプライチェーン保護を重視して SHA で pin する (Dependabot が SHA とコメントを自動更新)。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # 公式 astral-sh/setup-uv で uv をセットアップ。SHA で pin (理由は上の Checkout と同じ)。
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          # Action の SHA だけでなくインストールされる uv 本体のバージョンも固定し、
          # 再現性を担保する。Dependabot は version: を更新しないため bump は手動。
          version: "0.11.17"
          enable-cache: true

      # uv.lock どおりに依存をインストール
      - name: Install dependencies
        run: uv sync --frozen

      # ビルドと gh-pages への デプロイを一括実行。
      # production への直 push は PR の CI を経由しないため、ここでも --strict で
      # リンク切れ・設定ミスを検証し、不正な内容を本番公開しないようにする。
      - name: Build and deploy to GitHub Pages
        run: uv run --frozen mkdocs gh-deploy --force --strict
