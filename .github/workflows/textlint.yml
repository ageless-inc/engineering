name: textlint

# develop / production への PR で日本語ドキュメントを校正し、表記ゆれや
# である/ですます混在をマージ前に機械チェックして品質を保つ。
on:
  pull_request:
    branches:
      - develop
      - production

# 校正のみなので read 権限で十分
permissions:
  contents: read

# 同一 PR への連続 push では古い検証をキャンセルしてよい
concurrency:
  group: textlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  textlint:
    # ランナー世代の自動切替による差異を避けるためメジャー版を固定 (latest は 24.04 を指す)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 校正対象は作業ツリーのファイルのみで git 履歴は不要なため浅いクローンで十分。
      # 以降の Action はサプライチェーン保護のため SHA で pin する (Dependabot が SHA とコメントを自動更新)。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Node をセットアップし npm キャッシュを有効化。Node 版は .nvmrc を単一ソースとして
      # 参照し (uv 側が .python-version を参照するのと対称)、CI とローカルのドリフトを防ぐ。
      # 依存パッケージのバージョンは package-lock.json で固定済み。
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json どおりに依存をインストール (再現性のため install ではなく ci)
      - name: Install dependencies
        run: npm ci

      # docs 配下の Markdown を textlint で校正
      - name: Run textlint
        run: npm run lint:text
