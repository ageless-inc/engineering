name: Build check

# develop / production への PR でビルドを検証し、リンク切れや設定ミスをマージ前に検出する
on:
  pull_request:
    branches:
      - develop
      - production

# ビルドのみなので read 権限で十分
permissions:
  contents: read

# 同一 PR への連続 push では古い検証をキャンセルしてよい (デプロイと違い安全)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ランナー世代の自動切替によるビルド差異を避けるためメジャー版を固定 (latest は 24.04 を指す)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 履歴を使うプラグインは未導入で、--strict のビルド検証に全履歴は不要なため浅いクローンで十分。
      # 以降の Action はサプライチェーン保護のため SHA で pin する (Dependabot が SHA とコメントを自動更新)。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # 公式 astral-sh/setup-uv で uv をセットアップ。SHA で pin (理由は上の Checkout と同じ)。
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      # uv.lock どおりに依存をインストール
      - name: Install dependencies
        run: uv sync --frozen

      # --strict で警告 (リンク切れ・無効なナビ項目等) をエラーに昇格させ、ビルドを失敗させる
      - name: Build (strict)
        run: uv run --frozen mkdocs build --strict
