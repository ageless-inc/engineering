name: Build check

# develop / production への PR でビルドを検証し、リンク切れや設定ミスをマージ前に検出する
on:
  pull_request:
    branches:
      - develop
      - production

# ビルドのみなので read 権限で十分
permissions:
  contents: read

# 同一 PR への連続 push では古い検証をキャンセルしてよい (デプロイと違い安全)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ランナー世代の自動切替によるビルド差異を避けるためメジャー版を固定 (latest は 24.04 を指す)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # git-revision-date-localized が最終更新日を正確に算出するには全履歴が必要なため
      # fetch-depth: 0 でフルクローンする。--strict ビルドでも警告を出さないために CI 側にも必須。
      # 以降の Action はサプライチェーン保護のため SHA で pin する (Dependabot が SHA とコメントを自動更新)。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      # 公式 astral-sh/setup-uv で uv をセットアップ。SHA で pin (理由は上の Checkout と同じ)。
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          # Action の SHA だけでなくインストールされる uv 本体のバージョンも固定し、
          # 再現性を担保する。Dependabot は version: を更新しないため bump は手動。
          version: "0.11.17"
          enable-cache: true

      # uv.lock どおりに依存をインストール
      - name: Install dependencies
        run: uv sync --frozen

      # --strict で警告 (リンク切れ・無効なナビ項目等) をエラーに昇格させ、ビルドを失敗させる
      - name: Build (strict)
        run: uv run --frozen mkdocs build --strict
