version: 2
updates:
  # Python 依存 (pyproject.toml + uv.lock) を毎週チェックして更新 PR を作成
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # 毎週バラバラに PR が来る運用負荷を抑えるため、Python 依存はまとめて 1 PR にする
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions のバージョンを毎週チェックして更新 PR を作成
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Actions の SHA 更新もまとめて 1 PR にする
    groups:
      github-actions:
        patterns:
          - "*"
